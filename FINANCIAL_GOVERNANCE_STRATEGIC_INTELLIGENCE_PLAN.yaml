# ====================================================================================
# RISKS
# ====================================================================================
risks:
  - risk_id: "RISK-FGSI-001"
    description: "YAML storage may be too slow for large financial time-series datasets"
    severity: "MEDIUM"
    probability: "MEDIUM"
    impact: "Dashboard latency above acceptable thresholds (>2s load time)"
    mitigation: "Migration path to SQLite pre-planned. Implement caching layer from Phase 5. Monitor response times."
    status: "OPEN"

  - risk_id: "RISK-FGSI-002"
    description: "Encryption key management complexity for multi-user deployment"
    severity: "HIGH"
    probability: "LOW"
    impact: "Data loss if encryption key is lost or rotated incorrectly"
    mitigation: "Environment variable key storage. Key rotation procedure documented. Backup encryption in place."
    status: "OPEN"

  - risk_id: "RISK-FGSI-003"
    description: "Indirect impact attribution accuracy may be insufficient with manual percentages"
    severity: "MEDIUM"
    probability: "MEDIUM"
    impact: "Misleading financial recommendations for indirect programs"
    mitigation: "Start with manual attribution, build correlation tracking to validate/refine over time. Clear UI labelling of confidence levels."
    status: "OPEN"

  - risk_id: "RISK-FGSI-004"
    description: "Financial dashboard toggle may impact existing portfolio dashboard performance"
    severity: "LOW"
    probability: "LOW"
    impact: "Slower page load for users who don't use financial features"
    mitigation: "Lazy loading — financial data and charts only initialise when toggle activated. No impact on default portfolio view."
    status: "OPEN"

