<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — Systems³</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 100%);
            color: #fff; padding: 24px;
        }
        .card {
            text-align: center; max-width: 400px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 48px 32px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 0.95rem; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 24px; }
        .retry-btn {
            display: inline-block; padding: 12px 28px;
            background: #fff; color: #1e40af; font-weight: 600;
            border-radius: 10px; border: none; cursor: pointer;
            font-size: 0.9rem; transition: transform 0.15s;
        }
        .retry-btn:active { transform: scale(0.96); }
        .brand { margin-top: 32px; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Systems³ needs an internet connection to load your project data. Please check your connection and try again.</p>
        <button class="retry-btn" onclick="location.reload()">Retry Connection</button>
        <div class="brand">Systems³ Project Reporter</div>
    </div>
</body>
</html>
