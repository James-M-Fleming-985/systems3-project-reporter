# ═══════════════════════════════════════════════════════════════════
# This plan EXTENDS the existing MVP in place:
#   https://github.com/James-M-Fleming-985/mvp-32-mc-scanner-and-risk-identification
# Phase 1 begins with an audit of what exists; every subsequent phase
# adds a vertical slice (ingest → normalise → score → display → alert)
# on top of the same codebase rather than rebuilding.
#
# Terminology: the assessment is called IMPACT ASSESSMENT (client term),
# not "risk assessment".
#
# PLM: Phase 2 delivers the CAPABILITY (adapter interface + Teamcenter
# reference adapter + synthetic dataset), not a tenant rollout.
# ═══════════════════════════════════════════════════════════════════

